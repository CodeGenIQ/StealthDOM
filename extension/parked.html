<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>💤 Sleeping Window</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111625;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }
    .card {
      background: #16213e;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 24px 32px;
      text-align: center;
      max-width: 460px;
    }
    .icon { font-size: 32px; margin-bottom: 10px; }
    .title { font-size: 15px; font-weight: 600; color: #f8fafc; margin-bottom: 6px; word-break: break-word; }
    .sub { font-size: 12px; color: #64748b; margin-bottom: 16px; }
    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">💤</div>
    <div class="title" id="parkedTitle">Window Sleeping to Save Memory</div>
    <div class="sub">StealthDOM Tab Governor unloaded this minimized window's active tab.</div>
    <button class="btn" id="restoreBtn">Wake &amp; Restore Tab</button>
  </div>
  <script src="parked.js"></script>
</body>
</html>
