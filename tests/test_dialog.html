<!DOCTYPE html>
<html>
<head>
    <title>Dialog Test Page</title>
</head>
<body>
    <h1>JavaScript Dialog Test</h1>
    <button id="alertBtn" onclick="setTimeout(() => alert('Hello Alert!'), 100)">Show Alert</button>
    <button id="confirmBtn" onclick="setTimeout(() => window.testConfirmResult = confirm('Are you sure?'), 100)">Show Confirm</button>
    <button id="promptBtn" onclick="setTimeout(() => window.testPromptResult = prompt('What is your name?'), 100)">Show Prompt</button>
</body>
</html>
